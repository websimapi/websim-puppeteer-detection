<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puppeteer Detection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>
  <script>
    // Function to detect if browser is likely Puppeteer or similar headless browser
    function isPuppeteerLike() {
      // Collect various signals that might indicate a headless browser
      const signals = [
        // Check for navigator.webdriver flag (often true in automated browsers)
        !!navigator.webdriver,
        
        // Check for missing or empty languages (common in headless browsers)
        !navigator.languages || navigator.languages.length === 0,
        
        // Check for plugins (typically empty in headless browsers)
        navigator.plugins.length === 0,
        
        // Check user agent for headless indicators
        /headless|phantomjs|puppeteer|selenium|webdriver/i.test(navigator.userAgent),
        
        // Connection properties often reveal automation
        navigator.connection && navigator.connection.rtt === 0,
        
        // Chrome automation-related properties
        !!window.domAutomation || !!window.domAutomationController
      ];
      
      // If any signals are true, it might be a headless browser
      return signals.some(signal => signal === true);
    }
    
    // Set background color based on detection
    document.body.style.backgroundColor = isPuppeteerLike() ? 'green' : 'red';
  </script>
